
name: REST Assured API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: |
          rm -rf allure-results allure-report
          mvn clean test

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload test and Allure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            target/surefire-reports/
            allure-results/
            allure-report/
          if-no-files-found: warn

      - name: Email test report
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GYUIMGXYWTQPABOJ }}
          subject: 'REST Assured API Tests - ${{ steps.tests.outcome }}'
          to: ${{ secrets.GMAIL_USERNAME }}
          from: REST Assured CI <${{ secrets.GMAIL_USERNAME }}>
          body: |
            REST Assured API test execution has completed.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Trigger: ${{ github.event_name }}
            Test status: ${{ steps.tests.outcome }}

            View the workflow run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Download the api-test-reports artifact from the workflow run to inspect the reports.
